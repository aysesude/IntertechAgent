<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper boat mark — preview</title>
<link rel="stylesheet" href="paper-boat.css">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#6b7280; --line:#e5e7eb; --panel:#fafafa; }
  body.dark { --bg:#0e1116; --fg:#e8eaed; --muted:#9aa4b2; --line:#242a33; --panel:#151a21; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:1rem;
           padding:1.25rem 2rem; border-bottom:1px solid var(--line); }
  h1 { font-size:1rem; font-weight:600; margin:0; letter-spacing:.01em; }
  button { font:inherit; padding:.4rem .8rem; border-radius:.5rem; cursor:pointer;
           border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  main { padding:2rem; display:grid; gap:1.25rem;
         grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); max-width:1400px; }
  section { border:1px solid var(--line); border-radius:.9rem; padding:1.25rem 1.5rem; background:var(--panel); }
  h2 { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.09em;
       color:var(--muted); margin:0 0 1rem; }
  .row { display:flex; align-items:flex-end; gap:1.75rem; flex-wrap:wrap; }
  .row > figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:.5rem; }
  figcaption { font-size:.7rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bubble { display:inline-flex; align-items:center; padding:.55rem .95rem;
            border-radius:1.1rem 1.1rem 1.1rem .25rem; background:var(--bg);
            border:1px solid var(--line); color:var(--muted); }
  .tint-a { color:#1d4ed8; } .tint-b { color:#059669; } .tint-c { color:#db2777; }
  .btn-primary { display:inline-flex; align-items:center; gap:.6rem; padding:.6rem 1.1rem;
                 border-radius:.6rem; background:var(--fg); color:var(--bg); border:0; font-weight:500; }
  .frames { display:flex; gap:.5rem; flex-wrap:wrap; }
  .frames .pb { animation-play-state:paused; }
  .frames .pb g { animation-play-state:paused; }
  .note { font-size:.8rem; color:var(--muted); margin:.9rem 0 0; }
</style>
</head>
<body>
<header>
  <h1>Paper boat mark</h1>
  <button id="theme">Toggle dark</button>
</header>

<main>
  <section>
    <h2>Logo — static</h2>
    <div class="row" id="logos"></div>
    <p class="note">A hairline stroke is added back below ~128&nbsp;px so the fine
      lines survive. Below ~32&nbsp;px the counters close up — use a simplified
      mark for favicons at that size.</p>
  </section>

  <section>
    <h2>Loading</h2>
    <div class="row" id="loaders"></div>
  </section>

  <section>
    <h2>Chat — thinking</h2>
    <div class="row" style="flex-direction:column;align-items:flex-start;gap:1rem" id="thinking"></div>
  </section>

  <section>
    <h2>Inherits colour</h2>
    <div class="row" id="tints"></div>
  </section>

  <section style="grid-column:1/-1">
    <h2>One cycle, frame by frame</h2>
    <div class="frames" id="cycle"></div>
  </section>
</main>

<script>

  tailL: 'M108.34 197.09C107.74 197.59 98.44 194.49 89.54 190.79 67.74 181.79 50.34 179.29 34.64 182.89 27.14 184.69 13.74 191.09 8.64 195.29 4.94 198.39 5.14 200.79 8.94 198.39 18.24 192.49 30.94 188.39 42.14 187.69 54.94 186.89 64.64 189.09 84.64 197.39 96.65 202.33 104.05 205.09 111 206.96Z',

  ripple: 'M260.24 206.99C252.04 208.79 243.24 212.99 235.94 218.49 226.94 225.29 229.34 225.89 241.94 219.89 260.84 210.89 275.74 209.29 291.94 214.39 295.74 215.59 299.04 216.29 299.34 215.99 300.24 215.09 292.14 210.49 286.04 208.49 277.44 205.69 268.54 205.09 260.24 206.99Z',
};

function inkFor(size) {
  if (size >= 128) return 0;
  if (size >= 88) return 0.4;
  if (size >= 60) return 0.6;
  if (size >= 44) return 0.8;
  return 1;
}

function ampFor(size) {
  if (size >= 96) return 1;
  if (size >= 64) return 1.15;
  if (size >= 44) return 1.35;
  return 1.6;
}

function mark({ size = 76, sailing = false, speed = 1, amplitude = 1, ink } = {}) {
  const stroke = ink === undefined ? inkFor(size) : ink;
  const cls = ['pb'];
  if (sailing) cls.push('pb--sailing', 'pb--busy');
  if (stroke > 0) cls.push('pb--inked');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', cls.join(' '));
  svg.setAttribute('viewBox', VIEW_BOX);
  svg.setAttribute('width', size);
  svg.setAttribute('height', Math.round(size * H / W * 100) / 100);
  svg.setAttribute('aria-hidden', 'true');
  svg.style.setProperty('--pb-ink', stroke);
  svg.style.setProperty('--pb-amp', Math.round(ampFor(size) * amplitude * 100) / 100);
  svg.style.setProperty('--pb-dur', (2.6 / speed).toFixed(2) + 's');
  for (const [name, key] of [['pb-swell','swell'],['pb-ripple','ripple'],
                             ['pb-tail-l','tailL'],['pb-tail-r','tailR'],['pb-hull','hull']]) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', name);
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', D[key]);
    if (key === 'hull') p.setAttribute('fill-rule', 'evenodd');
    g.appendChild(p);
    svg.appendChild(g);
  }
  return svg;
}

function figure(node, caption) {
  const f = document.createElement('figure');
  f.appendChild(node);
  const c = document.createElement('figcaption');
  c.textContent = caption;
  f.appendChild(c);
  return f;
}

const $ = (id) => document.getElementById(id);

for (const s of [160, 96, 64, 44, 32, 24])
  $('logos').appendChild(figure(mark({ size: s }), s + 'px'));

for (const [s, speed, cap] of [[112, 1, 'default'], [76, 1, '76px'], [56, 1.4, 'faster'], [40, 1, '40px']])
  $('loaders').appendChild(figure(mark({ size: s, sailing: true, speed }), cap));

const bubble = document.createElement('div');
bubble.className = 'bubble';
bubble.appendChild(mark({ size: 38, sailing: true, speed: 0.72, amplitude: 0.85 }));
const lab = document.createElement('span');
lab.className = 'pb-status__label';
lab.style.marginLeft = '.55em';
lab.innerHTML = 'Thinking<span class="pb-dots"><i>.</i><i>.</i><i>.</i></span>';
bubble.appendChild(lab);
$('thinking').appendChild(bubble);

const btn = document.createElement('button');
btn.className = 'btn-primary';
btn.appendChild(mark({ size: 30, sailing: true, speed: 1.2 }));
btn.appendChild(document.createTextNode('Sending'));
$('thinking').appendChild(btn);

for (const [cls, cap] of [['tint-a','#1d4ed8'], ['tint-b','#059669'], ['tint-c','#db2777']]) {
  const m = mark({ size: 72, sailing: true });
  m.classList.add(cls);
  $('tints').appendChild(figure(m, cap));
}

const DUR = 2.6, N = 8;
for (let i = 0; i < N; i++) {
  const m = mark({ size: 150, sailing: true });
  m.querySelectorAll('g').forEach(g => {
    g.style.animationDelay = (-DUR * i / N).toFixed(3) + 's';
    g.style.animationPlayState = 'paused';
  });
  $('cycle').appendChild(m);
}

$('theme').onclick = () => document.body.classList.toggle('dark');
</script>
</body>
</html>
