# Ruff ve black yapılandırması.
#
# Konfigürasyon olmadan ruff, kurulu sürümün varsayılan kural setiyle koşar ve
# sürüm değiştikçe CI'da farklı sonuç verir. Kuralları burada açıkça sabitliyoruz
# ki herkeste ve CI'da aynı davransın.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "frontend",
    "backend/alembic/versions",  # Alembic'in ürettiği dosyalara karışmıyoruz
]

[tool.ruff.lint]
# Ruff'un klasik varsayılanı: pycodestyle hataları + pyflakes.
# Ekip alıştıkça B (bugbear), SIM (simplify), UP (pyupgrade) eklenebilir.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # FastAPI'nin bağımlılık enjeksiyonu `Depends()` çağrısını varsayılan
    # argümanda kullanmayı gerektirir; framework'ün tasarımı bu.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# conftest.py, DATABASE_URL ortam değişkenini app.core.config import edilmeden
# ÖNCE ayarlamak zorunda (Settings değeri önbelleğe alıyor). Bu yüzden importlar
# kasıtlı olarak dosyanın başında değil.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agents", "mcp_server", "rag", "data", "tests"]
# MCP tool modülleri servis fonksiyonlarını `as fetch_*` diye içe aktarıyor:
# tool fonksiyonunun adı servis fonksiyonuyla aynı olduğu için takma ad şart
# (aksi halde tool kendi kendini çağırırdı). Bu ayar olmadan isort aynı
# modülden gelen beş takma adı beş ayrı `from ... import` bloğuna bölüyor.
combine-as-imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "backend/alembic/versions"
