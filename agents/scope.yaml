# Kapsam Kontrolü Yapılandırması
# NFR karşılığı: "Kapsam kontrolü kuralları koda gömülmez; yapılandırmada tutulur
# ve kod değişikliği gerektirmeden güncellenebilir."
#
# Bu bir TASLAKTIR. Anahtar isimleri ve yapı geliştiriciyle birlikte kesinleşecek.
# Amaç: kapsam kararlarının hangi biçimde ifade edileceğini somutlaştırmak.

version: 1
locale: tr-TR

# ---------------------------------------------------------------------------
# Kontrol sırası — davranışı belirler, değiştirilmemeli (bkz. kapsam-tanimi.md §5)
# ---------------------------------------------------------------------------
pipeline:
  - bos_mesaj          # AK-4.7  (arayüz katmanında)
  - dil_kontrolu       # K-4 · yalnızca 3 kelimeden uzun mesajlarda
  - enjeksiyon_kontrolu # K-6 · aynı mesaj, ayrı log
  - islem_talebi       # AK-4.6 · AK-4.9
  - sistem_bilgisi     # K-14 · sabit metin
  - smalltalk_meta
  - varlik_ekseni      # FR-12
  - kavram_kontrolu
  - niyet_kumesi       # FR-11
  - belirsiz_fallback  # AK-4.8

# ---------------------------------------------------------------------------
# KATMAN 1 — Varlık sınıfları
# Tekil varlık (ticker, fon kodu) BURAYA YAZILMAZ. Desteklenen tekil varlıklar
# tool/veri katmanında yaşar; bulunamayan varlık için AK-5.7 mesajı döner.
# ---------------------------------------------------------------------------
varlik_siniflari:

  kapsam_ici:
    - id: altin
      etiketler: [altın, altin, gram altın, ons altın, çeyrek altın, yarım altın,
                  tam altın, cumhuriyet altını, has altın, ziynet, XAU]

    # Karar K-1 (gümüşün v1'de kapsam dışı bırakılması) 2026-08-26'da geri
    # alındı: price_query.py gümüş/platini XAGTRY/XPTTRY ile zaten tam
    # destekliyordu, scope_checker'ın kapsam dışı sayması bir tutarsızlıktı
    # (ölçümle doğrulandı, analist canlı test turu).
    - id: emtia
      etiketler: [petrol, brent, ham petrol, brent petrol]

    - id: kiymetli_maden_diger
      etiketler: [gümüş, gumus, gram gümüş, XAG, platin, gram platin, XPT]

    # 2026-08-28: target_prices tablosu eklendi (bkz. app/services/
    # target_price_ingest.py) — analist hedef fiyatı/tavsiyesi artık
    # gerçekten desteklenen bir veri, kapsam dışı sayılmamalı.
    - id: hedef_fiyat
      etiketler: [hedef fiyat, hedef kapanış, analist tavsiyesi, analist hedef,
                  analist tahmini]

    - id: doviz
      etiketler: [dolar, usd, "$", euro, eur, "€", kur, döviz, parite,
                  sterlin, gbp, yen, jpy]
      # sterlin/yen sınıf düzeyinde geçer, veri katmanı eler (karar K-2)

    - id: bist_hisse
      etiketler: [bist, borsa istanbul, bist100, "bist 100", hisse, hisse senedi,
                  borsa, pay, endeks]

    - id: abd_hisse
      etiketler: [nasdaq, s&p, "s&p 500", dow jones, abd hissesi,
                  amerikan hissesi, wall street]

    - id: tefas_fon
      etiketler: [fon, tefas, yatırım fonu, serbest fon, katılım fonu,
                  para piyasası fonu, fon kodu]

  kapsam_disi:
    - id: kripto
      etiketler: [bitcoin, btc, ethereum, eth, kripto, coin, altcoin,
                  blokzincir, blockchain, nft, stablecoin]

    - id: turev
      etiketler: [vadeli işlem, opsiyon, kaldıraç, forex kaldıraç, açığa satış,
                  futures, vİop]

    - id: sabit_getirili
      etiketler: [tahvil, bono, eurobond, mevduat, faiz oranı hesabı, repo]

    - id: gayrimenkul
      etiketler: [ev, konut, arsa, gayrimenkul, kira getirisi, ipotek]

    # 1 Eylül 2026 ürün kararı: PETROL/BRENT bu listeden ÇIKARILDI, kapsam
    # içine alındı. Fiyatı her gün toplanıyor ve Piyasa şeridinde
    # gösteriliyor; ekranda gösterip sohbette reddetmek tutarsızdı.
    # Bakır/buğday/doğalgaz kapsam dışı KALIYOR — onların verisi yok.
    - id: emtia_diger
      etiketler: [bakır, buğday, doğalgaz]

    - id: bankacilik_urunleri          # karar K-15 — v2'de yeniden değerlendirilecek
      etiketler: [kredi, kredi kartı, ihtiyaç kredisi, konut kredisi, taşıt kredisi,
                  kredi notu, findeks, limit, taksit, vadeli hesap, vadesiz hesap,
                  mevduat hesabı, hesap işletim ücreti, iban, banka kartı]
      # Kavram soruları da dahil kapsam dışıdır ("kredi notu nedir?" reddedilir)

# ---------------------------------------------------------------------------
# İşlem talebi — varlık ekseninden ÖNCE çalışır
# ---------------------------------------------------------------------------
islem_talebi:
  fiiller: [al, satın al, sat, alım, satım, transfer, transfer et, gönder, havale, eft, öde,
            yatır, çek, aç, kapat, iptal et, emir, emir ver, işlem yap,
            para gönder, hesap aç, abone ol]
  # Sonek toleransı UYGULANMAYAN fiiller: yalnızca tam kelime olarak eşleşirler.
  #
  # Kelime eşleştirme, 5 harften uzun fiillere 6 karaktere kadar sonek
  # toleransı tanıyor ("transfer" -> "transferi"). "yatır" tam 5 harf olduğu
  # için bu toleransı alıyor ve **"yatırım"** kelimesini yutuyordu — bu ürünün
  # en sık geçen ismini. Ölçülen sonuç (23 Ağustos test turu): "Çok fazla
  # hisseye mi YATIRIM yapıyorum?" sorusu, yani düpedüz bir risk sorusu,
  # "Bu işlemi gerçekleştirmeye yetkim bulunmuyor" ile reddediliyordu.
  #
  # İstisna kalıplarına "yatırım" eklemek çözüm DEĞİL: o liste tüm işlem
  # kontrolünü kapatıyor, yani "bana yatırım yap" gibi gerçek bir emir de
  # kapıdan geçerdi. Doğrusu fiili kendi biçimiyle sınırlamak — "yatır" zaten
  # emir kipinin tam hâli, ekli biçimlerine ihtiyaç yok.
  #
  # "satın al" da aynı sınıf: 8 harf olduğu için (boşluk dahil) sonek
  # toleransı alıyor ve "satın aldı" (gecmis zaman, ucuncu sahis — "Petkim
  # hangi şirketi satın aldı?" gibi kurumsal-olay sorularinda) "satın al" +
  # "dı" ekiyle eşleşip UNAUTHORIZED_ACTION donduruyordu (olculdu,
  # 2026-08-26: kurumsal olaylar tarihcesi turunde M&A sorulari
  # reddediliyordu). "satın al" da emir kipinin tam hali, ekli
  # ("aldı"/"alıyor"/"alacak") bicimlere ihtiyaç yok.
  tam_eslesme_fiiller: [yatır, "satın al"]
  # Not: "alayım mı" / "satayım mı" BURAYA GİRMEZ — onlar tavsiye bayrağıdır,
  # işlem talebi değildir. Ayrım kritik: soru soran kullanıcı reddedilmemeli.
  istisna_kaliplari: ["alayım mı", "satayım mı", "alsam mı", "satsam mı",
                      "almalı mıyım", "satmalı mıyım", "ne zaman alınır",
                      "geçmiş", "önce", "önceki", "hangisini", "neler",
                      "almışım", "satmışım", "aldığım", "sattığım",
                      "aldıklarım", "sattıklarım", "işlem"]
  sonuc: UNAUTHORIZED_ACTION

# ---------------------------------------------------------------------------
# Tavsiye bayrağı — sonuç sınıfı DEĞİL, IN_SCOPE_* üzerine binen bayrak
# ---------------------------------------------------------------------------
tavsiye_bayragi:
  tetikleyiciler: [alayım mı, satayım mı, ne olur, yükselir mi, düşer mi,
                   tavsiye, öneri, hangisi daha iyi, ne yapmalıyım,
                   yatırım yapayım mı, kazandırır mı, fırsat mı, tahmin]
  davranis:
    yanit_verilir: true          # kullanıcı boş çevrilmez
    oneri_dili_bastirilir: true
    tahmin_uretilmez: true
    nfr10_uyarisi: zorunlu

# ---------------------------------------------------------------------------
# KATMAN 1 — Kavram kapsamı (Bilgi Ajanı / RAG)
# ---------------------------------------------------------------------------
kavram_kapsami:
  # Beş soru biçimi: tanım, hesaplama, işleyiş/yaygın uygulama, karşılaştırma,
  # süreç/zamanlama. Kapsam yalnızca "x nedir" ile sınırlı DEĞİL — kullanıcı
  # aynı konuyu "nasıl hesaplanır" ya da "ne sıklıkla olur" diye de soruyor
  # ve ikisi de kavram sorusudur.
  soru_kaliplari: [nedir, ne demek, ne anlama gelir, nasıl hesaplanır,
                   nasıl bulunur, nasıl çalışır, nasıl olur, nasıl yapılır,
                   farkı nedir, ne işe yarar,
                   ne sıklıkla, ne zaman verilir, ne zaman geçer,
                   kaç günde, ne kadar sürer, zorunlu mu, kimler]

  # "Nasıl hesaplanır" sorusunun cevabı, hesap BU UYGULAMADA yapılıyorsa
  # uygulamanın kendi tanımıdır; ders kitabı formülü değil. Aksi halde açıklama
  # ile ekrandaki rakam birbirini yalanlar. Tanımlar
  # agents/prompts/web_research_agent.md içindeki EV KURALLARI bölümünde,
  # kaynakları docs/API.md ve portfolio_service'te.
  ev_kurallari_gerektiren: [kar orani, kar zarar, getiri, donem getirisi,
                            endeks kiyaslamasi, varlik agirligi]

  # "Ne sıklıkla / genelde nasıl olur" cevapları şirkete, kuruma ve alınan
  # karara göre değişir; tek bir sayı evrensel kural gibi sunulmamalı.
  degiskenlik_uyarisi_gerektiren: [ne sıklıkla, genelde, genellikle, kaç günde,
                                   ne zaman verilir, ne kadar sürer]

  kapsam_ici_konular:
    - hisse_temelleri      # halka arz, temettü, F/K, piyasa değeri, lot, tavan/taban
    - endeks               # BIST 100 nedir, endeks hesabı
    - fonlar               # TEFAS işleyişi, fon türleri, gider oranı
    - doviz                # kur, alış/satış farkı, çapraz kur
    - altin                # gram/ons/has ilişkisi, milyem
    - portfoy              # çeşitlendirme, dağılım, ağırlıklandırma
    - risk                 # volatilite, risk toleransı, getiri-risk ilişkisi
    - vergi                # KISITLI — bkz. kisitli_konular.vergi

  kapsam_disi_konular:
    - kripto_kavramlari
    - turev_kavramlari
    - hukuki_danismanlik   # miras, vekalet, dava
    - makro_teori

# ---------------------------------------------------------------------------
# Kısıtlı konular — IN_SCOPE_CONCEPT üzerine binen ek bayrak (karar K-3)
# ---------------------------------------------------------------------------
kisitli_konular:
  vergi:
    etiketler: [vergi, stopaj, beyan, beyanname, mükellef, gelir vergisi,
                vergilendirme, muafiyet, istisna]
    kurallar:
      sayi_verilmez: true        # oran, tutar, istisna sınırı, beyan eşiği
      kisisel_hesap_yapilmaz: true
      kosul_dili_zorunlu: true   # "gerekebilir", "durumunuza göre değişir"
      uzman_yonlendirmesi: zorunlu
      kaynak_tarihi_zorunlu: true
    yonlendirme_metni: >
      Kesin bilgi için bir mali müşavire danışmanızı öneririm.

  kural: >
    Kavram sorusu yalnızca kapsam içi bir varlık sınıfı veya yukarıdaki
    kapsam_ici_konular başlıklarıyla ilişkiliyse IN_SCOPE_CONCEPT üretir.
    "Bitcoin nedir?" kavram sorusudur ancak varlık sınıfı kapsam dışıdır → OUT_OF_SCOPE.

# ---------------------------------------------------------------------------
# Niyet → ajan kümesi eşlemesi (FR-11)
# ---------------------------------------------------------------------------
niyet_kumesi:
  portfoy:
    etiketler: [portföyüm, portfoyum, hesabım, varlıklarım, ne kadar kazandım,
                dağılımım, benim, elimdeki]
    ajan: portfoy_ajani
  piyasa:
    etiketler: [kaç, ne kadar oldu, güncel, son durum, haber, enflasyon,
                fiyat, kur, endeks değeri]
    ajan: piyasa_ajani
  risk:
    etiketler: [risk, riskli, volatilite, güvenli, oynaklık, ne kadar riskli]
    ajan: risk_ajani
  kavram:
    ajan: bilgi_ajani      # YENİ — sprint kartı gerekiyor

# ---------------------------------------------------------------------------
# Karışık varlık soruları — tek mesajda birden fazla varlık sınıfı (karar K-9)
# ---------------------------------------------------------------------------
karisik_varlik:
  aktif: true
  kural: en_az_biri_kapsam_ici_ise_kismi_yanit
  # Hiçbiri kapsam içi değilse → OUT_OF_SCOPE (kısmi yanıt yok)

  sonuca_eklenen_alanlar:
    - kismi_kapsam        # boolean
    - elenen_siniflar     # örn. [kripto] — mesaj metni bundan üretilir

  karsilastirma_kaliplari: ["mı ... mı", "mi ... mi", hangisi, daha iyi,
                            daha mantıklı, karşılaştır, kıyasla, "yerine"]
  # Bu kalıplar tavsiye_bayragi'nı da tetikler → öneri üretilmez, yalnızca veri

  karsilastirma_reddi_zorunlu: true
  # Kapsam dışı varlık varken karşılaştırma istendiyse, yapılamadığı açıkça söylenir

# ---------------------------------------------------------------------------
# Çok turlu bağlam — hibrit model (karar K-8)
# Varsayılan: bağlamsız. Bağlam yalnızca takip sorusu tespit edilirse kullanılır.
# ---------------------------------------------------------------------------
coklu_tur:
  aktif: true
  pencere: 1                    # yalnızca bir önceki tur

  takip_tespiti:
    max_kelime: 6
    devam_belirtecleri: [peki, ya, "peki ya", o zaman, neden, niye, nasıl yani,
                         ne kadar, başka, ayrıca, bir de, ondan sonra]

  turler:
    varlik_devri:               # yeni varlık var, niyet yok
      devralinan: [niyet]
      yeni_varlik_kapsam_kontrolunden_gecer: true   # KRİTİK
    derinlestirme:              # ne varlık ne niyet var
      devralinan: [niyet, varlik]

  devralinabilir_sonuclar:
    - IN_SCOPE_PORTFOLIO
    - IN_SCOPE_MARKET
    - IN_SCOPE_RISK
    - IN_SCOPE_CONCEPT
    - OUT_OF_SCOPE            # kullanıcı aynı konuda ısrar ediyor → tutarlı mesaj
    - UNAUTHORIZED_ACTION
  # AMBIGUOUS ve SMALLTALK_META devralınmaz — çözülmüş bağlam taşımazlar

# ---------------------------------------------------------------------------
# Talimat geçersiz kılma denemeleri (karar K-6)
# Ayrı sonuç sınıfı, AYNI kullanıcı mesajı. Fark yalnızca logda.
# ---------------------------------------------------------------------------
enjeksiyon_kontrolu:
  aktif: true
  sonuc: INJECTION_ATTEMPT
  mesaj_kaynagi: mesajlar.out_of_scope.varsayilan   # BİREBİR AYNI · ayrı metin YOK
  loglanir: true
  log_alanlari: [ham_mesaj, tespit_edilen_varyant, oturum_id, zaman]

  # Tespit TEK KELİMEYE değil TALİMAT KALIBINA dayanır.
  # Yanlış pozitif riski: "kuralların neler?" → SYSTEM_INFO,
  # "bana tavsiye ver" → IN_SCOPE + tavsiye bayrağı. Bunlar elenmemeli.
  varyantlar:
    dogrudan: [talimatlarını yok say, önceki talimatları unut, sistem promptunu,
               kurallarını göster, ilk mesajını yaz, prompt'unu paylaş]
    rol_yapma: [sen artık, kısıtlaması olmayan, rolündesin, gibi davran,
                senaryoda, karakterini değiştir, jailbreak, dan modu]
    yetki_iddiasi: [ben geliştiriciyim, test modu, yönetici olarak, admin,
                    yetkili olarak talep, debug modunu aç]
    kural_kilifli: [kuralını devre dışı, bu sefer istisna, kısıtlamayı kaldır,
                    uyarıyı ekleme, tavsiye vermeme kuralını]
    kademeli_ikna: [aramızda kalsın, kimse bilmeyecek, sadece bu sefer,
                    resmi olmayan, gayri resmi olarak]

# ---------------------------------------------------------------------------
# Girdi sınırları — ARAYÜZ katmanı, kapsam kontrolüne ulaşmaz (karar K-18)
# ---------------------------------------------------------------------------
girdi_sinirlari:
  bos_mesaj_gonderilemez: true    # AK-4.7
  max_karakter: 500               # K-18
  asildiginda:
    istek_gonderilmez: true
    gonder_butonu_aktif: false
    kalan_karakter_gosterilir: true   # sessiz uygulama YASAK
    uyari_metni: >
      Mesajınız çok uzun. Lütfen sorunuzu 500 karakteri aşmayacak şekilde kısaltın.

# ---------------------------------------------------------------------------
# Dil kontrolü (karar K-4) — ayrı sonuç sınıfı, OUT_OF_SCOPE DEĞİL
# Gerekçe: red sebebi konu değil dil. Aynı sınıfta toplamak log sinyalini kirletir.
# ---------------------------------------------------------------------------
dil_kontrolu:
  aktif: true
  desteklenen_diller: [tr]
  min_kelime: 4              # KRİTİK: 3 kelime ve altı tespit adımını ATLAR
  # Koruma nedeni: "dolar kac" (şapkasız TR), "Apple"/"Bitcoin" (§5.2 tek kelime),
  # "peki ya euro?" (§5.1 takip) yanlışlıkla yabancı sanılırsa o davranışlar bozulur.
  kararsizlikta_varsayilan: tr   # TR'yi yanlışlıkla reddetmek daha kötü
  sonuc: UNSUPPORTED_LANGUAGE

# ---------------------------------------------------------------------------
# Zaman ifadeleri (karar K-11) — kapsam kontrolü BAKMAZ, Katman 2 karar verir
# ---------------------------------------------------------------------------
zaman_ifadeleri:
  kapsam_kontrolunde_elenir: false   # bilinçli · gerekçe için kapsam-tanimi.md §3.2
  veri_yok_loglanir: true            # zaman aralığıyla birlikte · maliyet ölçümü için

# ---------------------------------------------------------------------------
# Tek kelimelik varlık girdisi (karar K-12)
# Yalnızca BAĞLAMSIZ girdiler için; bağlam varsa coklu_tur devreye girer.
# ---------------------------------------------------------------------------
tek_kelime_girdi:
  aktif: true
  kosullar:
    tek_varlik_adi_olmali: true      # iki varlık → karisik_varlik · sıfır varlık → AMBIGUOUS
    onceki_tur_devralinabilir_degil: true
  varsayilan_niyet: piyasa           # portföy DEĞİL — kapalı varsayım tekrarlanmaz
  yonlendirme_cumlesi_zorunlu: true  # bu cümle olmadan karar geçersiz
  yonlendirme_metni: >
    Portföyünüzdeki durumunu veya risk analizini de sorabilirsiniz.

# ---------------------------------------------------------------------------
# Sistem ve gizlilik soruları (karar K-14)
# Yanıtlar SABİT METİNDİR. LLM bu metinleri yeniden yazmaz/özetlemez/genişletmez.
# ---------------------------------------------------------------------------
sistem_bilgisi:
  aktif: false        # içerik onayı alınana kadar KAPALI — bkz. kapsam-tanimi.md §5.4
  llm_yeniden_yazamaz: true
  sonuc: SYSTEM_INFO

  konular:
    - id: oturum_saklama
      etiketler: [konuşmalarım kaydediliyor mu, sohbet geçmişi, geçmişim saklanıyor mu,
                  konuşma kaydı]
      metin: >
        Sohbet geçmişi yalnızca oturum boyunca tutulur; oturumu sonlandırdığınızda
        saklanmaz.
      kaynak: FR — mevcut gereksinimlerden türetildi · DOĞRULANDI

    - id: veri_saklama
      etiketler: [verilerim nerede, veri saklanıyor, nerede tutuluyor, sunucu]
      metin: "DOLDURULACAK — teknik ekip onayı gerekli"
      kaynak: ONAY BEKLİYOR

    - id: veri_erisimi
      etiketler: [kim görebiliyor, kim erişebiliyor, portföyümü kim görüyor,
                  paylaşılıyor mu]
      metin: "DOLDURULACAK — teknik/hukuk onayı gerekli"
      kaynak: ONAY BEKLİYOR

    - id: yapay_zeka_kullanimi
      etiketler: [yapay zeka mısın, bot musun, insan mısın, hangi modeli kullanıyorsun]
      metin: "DOLDURULACAK — ürün ekibi kararı gerekli"
      kaynak: ONAY BEKLİYOR

# ---------------------------------------------------------------------------
# Destek talepleri (karar K-13) — OUT_OF_SCOPE, desteğe özel mesaj varyantı
# ---------------------------------------------------------------------------
destek_talebi:
  # Etiketler KELİME SINIRIYLA aranır (scope_checker._matches_word). Tek başına
  # duran genel kelimeler buraya YAZILMAZ; eşleşmesi kullanıcıyı reddediyor.
  # Kaldırılanlar ve sebepleri:
  #   destek      -> "destek seviyesi" teknik analiz terimi, meşru bir soru
  #   çalışmıyor  -> "borsa çalışmıyor mu" meşru bir piyasa sorusu
  #   bug         -> "bugün" içinde eşleşiyordu; kelime sınırı bunu çözdü ama
  #                  "hata alıyorum" zaten kapsıyor, tekil değeri yok
  etiketler: [şifremi unuttum, giriş yapamıyorum, hesabıma giremiyorum,
              uygulama donuyor, uygulama açılmıyor, hata alıyorum,
              müşteri hizmetleri, destek talebi, teknik destek, destek ekibi,
              uygulama çalışmıyor, site çalışmıyor]
  sonuc: OUT_OF_SCOPE
  mesaj_varyanti: destek

# ---------------------------------------------------------------------------
# Duygusal bağlam bayrağı (karar K-16)
# Sonuç sınıfını DEĞİŞTİRMEZ — yalnızca yanıt üretim kurallarını etkiler.
# ---------------------------------------------------------------------------
duygusal_baglam:
  aktif: true
  tetikleyiciler: [her şeyimi kaybettim, paramı yaktım, mahvoldum, iflas,
                   çok kötüyüm, batırdım, hepsi gitti, ne yapacağım şimdi,
                   perişan, çaresizim, dayanamıyorum]
  davranis:
    kabul_cumlesi_ile_baslar: true
    veri_verilir: true              # soru yanıtsız bırakılmaz
    oneri_dili_bastirilir: true     # tavsiye_bayragi'ndan daha katı
    kesinlik_dili_yasak: [kesinlikle, mutlaka, endişelenmeyin, merak etmeyin,
                          hiçbir şey olmaz]
    kisa_tutulur: true
  sinir: >
    Bayrak yalnızca tonu değiştirir. Psikolojik destek sağlanmaz, durum
    değerlendirmesi yapılmaz, kullanıcının duygusal durumu hakkında yorum yürütülmez.

  # AÇIK MADDE K-17 — kriz sinyali · ürün sahibi + hukuk/uyum onayı bekliyor
  # Karar verilene kadar ek mekanizma YOK; yalnızca yukarıdaki ton kuralları işler.
  kriz_sinyali:
    aktif: false
    karar: BEKLIYOR

# ---------------------------------------------------------------------------
# Belirsizlik — VARSAYIM YAPILMAZ
# Mevcut koddaki hata: hiçbir eşleşme yoksa portföy varsayılıyor.
# ---------------------------------------------------------------------------
belirsiz_fallback:
  varsayilan_ajan: null      # kritik: null kalmalı
  sonuc: AMBIGUOUS

# ---------------------------------------------------------------------------
# Kullanıcıya gösterilen metinler
# Metinler koddan ayrı tutulur; içerik ekibi kod değişikliği olmadan güncelleyebilir.
# ---------------------------------------------------------------------------
mesajlar:
  out_of_scope:
    varsayilan: >
      Bu konuda yardımcı olamıyorum. Portföyünüz, altın, döviz, BIST ve ABD
      hisseleri, TEFAS fonları ve temel yatırım kavramları hakkındaki sorularınızı
      yanıtlayabilirim.
    ornek_sorular_gosterilir: true

    destek:                  # karar K-13
      metin: >
        Hesap ve teknik konularda yardımcı olamıyorum; bu tür işlemler yetki alanımın
        dışında. Portföyünüz ve piyasalar hakkındaki sorularınızı yanıtlayabilirim.
      ornek_sorular_gosterilir: false
      # Destek kanalı tanımlandığında yalnızca bu metin güncellenir

  # Gelecek tahmini. Kapsam dışı DEĞİL — soru finansal ve varlık kapsam içinde;
  # reddedilen şey elimizde olmayan bir bilgiyi üretmek (uydurmama, AK 5.5).
  # Ayrı bir metin olmasının sebebi bu: "bu konuda yardımcı olamıyorum" demek
  # soruyu anlamadığımızı ya da konunun kapsam dışı olduğunu ima ederdi.
  gelecek_tahmini:
    varsayilan: >
      Gelecekteki fiyat, kur veya getiri tahmini yapmıyorum — elimdeki veriler
      geçmişe ve bugüne ait. Geçmiş performansı, güncel durumu ve açıklanmış
      finansal sonuçları paylaşabilirim.
    ornek_sorular_gosterilir: false

  unauthorized_action:
    varsayilan: >
      İşlem gerçekleştirme yetkim bulunmuyor. Alım, satım, transfer ve benzeri
      işlemleri yapamam; ancak bu konularda bilgi verebilirim.
    ornek_sorular_gosterilir: false

  unsupported_language:      # karar K-4 · yanıt TÜRKÇE verilir
    varsayilan: >
      Şu anda yalnızca Türkçe hizmet verebiliyorum. Sorunuzu Türkçe olarak
      iletirseniz yardımcı olabilirim.
    ornek_sorular_gosterilir: true

  ambiguous:
    varsayilan: >
      Sorunuzu tam olarak anlayamadım. Portföyünüzle mi, güncel piyasa verileriyle
      mi, yoksa bir kavramla mı ilgileniyorsunuz?
    ornek_sorular_gosterilir: true

  smalltalk_meta:
    etiketler: [merhaba, selam, günaydın, iyi akşamlar, nasılsın, merhaba bot, selamlar]
    varsayilan: >
      Merhaba! Portföyünüz ve piyasalar hakkındaki sorularınızı yanıtlayabilirim.
    ornek_sorular_gosterilir: true

  kismi_kapsam:              # karar K-9
    varlik_notu: >
      {elenen_sinif_adi} kapsamım dışında olduğu için bu konuda bilgi veremiyorum.
    karsilastirma_reddi: >
      {elenen_sinif_adi} kapsamım dışında olduğu için ikisini karşılaştıramıyorum.
    ornek_sorular_gosterilir: false

  veri_yok:                  # AK-5.7 — Katman 2
    varsayilan: "Bu konuda güncel bir bilgi bulamadım."

  nfr10_uyarisi:
    metin: "Bu bir yatırım tavsiyesi değildir."

ornek_sorular:
  - "Portföyümün dağılımı nasıl?"
  - "Dolar kuru bugün ne durumda?"
  - "Halka arz nedir?"
  - "Portföyüm ne kadar riskli?"
  - "Enflasyon verisi portföyümü nasıl etkiler?"
