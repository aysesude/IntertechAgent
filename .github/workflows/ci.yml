name: ci

# Her PR'da ve test/main'e push'ta çalışır.
# Branch koruma kuralı bu iş akışının yeşil olmasını zorunlu kılar.

on:
  pull_request:
  push:
    branches: [test, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: PyTorch (CPU-only)
        # Varsayılan PyPI paketi ~2 GB CUDA kütüphanesi çekiyor; CI'da GPU yok.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Bağımlılıkları kur
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Biçim kontrolü (black)
        run: black --check .

      - name: Testler (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Derleme kontrolü
        # Derlenmiyorsa canlıya alınamaz — tip hatalarını burada yakalarız.
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
