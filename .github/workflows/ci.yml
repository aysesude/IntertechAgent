name: ci

# Her PR'da ve test/main'e push'ta çalışır.
# Branch koruma kuralı bu iş akışının yeşil olmasını zorunlu kılar.

on:
  pull_request:
  push:
    branches: [test, main]

jobs:
  secrets:
    # Sızmış kimlik bilgisi taraması. Dosya uzantısından bağımsız çalışır —
    # ruff/black'in taramadığı uzantısız dosyalar da kapsanır.
    # --no-git: yalnızca çalışma ağacı taranır. Git geçmişi bilerek kapsam
    # dışı — geçmişte bilinen bir sızıntı var (rotasyonla ölecek) ve geçmiş
    # taraması tüm PR'ları kalıcı olarak kırmızıya boyardı.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gizli anahtar taraması (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --verbose

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: PyTorch (CPU-only)
        # Varsayılan PyPI paketi ~2 GB CUDA kütüphanesi çekiyor; CI'da GPU yok.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Bağımlılıkları kur
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Biçim kontrolü (black)
        run: black --check .

      - name: Testler (pytest)
        run: pytest

  # İŞ ADI `frontend`, KLASÖR `frontend-v2` — kasıtlı.
  #
  # Bu iş projenin tek arayüzünü kontrol ediyor, dolayısıyla adı doğru: v2
  # artık "ikinci arayüz" değil, arayüzün kendisi. Klasör adı ayrı bir iş
  # olarak sonra hizalanacak (bkz. docker-compose.yml).
  #
  # Ad ayrıca PRATİK bir zorunluluk: `frontend` dal koruma kural setlerinde
  # ZORUNLU kontrol olarak kayıtlı ve o kayıt yalnızca depo admini tarafından
  # değiştirilebilir. İş silinseydi ya da başka bir adla koşsaydı, kontrol hiç
  # rapor göndermez ve her PR "bekliyor" durumunda sonsuza kadar kilitlenirdi
  # — nitekim bir kez tam olarak bu oldu. Bu işi yeniden adlandırırken kural
  # setinin de güncellenmesi gerekir.
  frontend:
    # Bu iş olmadan arayüzdeki tip hataları CI'dan sessizce geçerdi.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - run: npm ci

      - name: Tip kontrolü (tsc)
        # eslint yok: taşınan proje eslint yapılandırmasıyla gelmedi.
        # Test dosyaları da bu kapsamda.
        run: npm run lint

      - name: Testler (vitest)
        # AuthContext ve useApiResource testleri burada koşar. İkisi de
        # tarayıcıda fark edilen gerçek hataların gerileme testlerini içeriyor
        # (beyaz ekran, sessizce mock veriye düşme).
        run: npm test

      - name: Derleme kontrolü
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
