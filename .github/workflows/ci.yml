name: ci

# Her PR'da ve test/main'e push'ta çalışır.
# Branch koruma kuralı bu iş akışının yeşil olmasını zorunlu kılar.

on:
  pull_request:
  push:
    branches: [test, main]

jobs:
  secrets:
    # Sızmış kimlik bilgisi taraması. Dosya uzantısından bağımsız çalışır —
    # ruff/black'in taramadığı uzantısız dosyalar da kapsanır.
    # --no-git: yalnızca çalışma ağacı taranır. Git geçmişi bilerek kapsam
    # dışı — geçmişte bilinen bir sızıntı var (rotasyonla ölecek) ve geçmiş
    # taraması tüm PR'ları kalıcı olarak kırmızıya boyardı.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gizli anahtar taraması (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --verbose

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: PyTorch (CPU-only)
        # Varsayılan PyPI paketi ~2 GB CUDA kütüphanesi çekiyor; CI'da GPU yok.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Bağımlılıkları kur
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Biçim kontrolü (black)
        run: black --check .

      - name: Testler (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Derleme kontrolü
        # Derlenmiyorsa canlıya alınamaz — tip hatalarını burada yakalarız.
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-v2:
    # frontend/ ile AYNI kontroller, ayrı bağımlılık ağacı olduğu için ayrı iş.
    # Bu iş olmadan frontend-v2'deki tip hataları CI'dan sessizce geçerdi.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - run: npm ci

      - name: Tip kontrolü (tsc)
        # frontend/'te eslint var, burada yok: taşınan proje eslint
        # yapılandırmasıyla gelmedi. `tsc --noEmit` şimdilik tek kapı.
        run: npm run lint

      - name: Derleme kontrolü
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
