name: deploy

# test branch'i  -> test ortamı  (test.<host>.nip.io)
# main branch'i  -> canlı ortam  (app.<host>.nip.io)
#
# CI yeşil olmadan deploy çalışmaz.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [test, main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Ortamı belirle
        id: env
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "dir=prod"             >> $GITHUB_OUTPUT
            echo "project=finans-prod"  >> $GITHUB_OUTPUT
            echo "port=8080"            >> $GITHUB_OUTPUT
          else
            echo "dir=test"             >> $GITHUB_OUTPUT
            echo "project=finans-test"  >> $GITHUB_OUTPUT
            echo "port=8000"            >> $GITHUB_OUTPUT
          fi

      - name: SSH anahtarını hazırla
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sunucuda güncelle ve doğrula
        # Sağlık kontrolü SSH oturumunun İÇİNDE yapılıyor. Uygulama portları
        # (8000/8080) GCP güvenlik duvarında dışarıya kapalı — dışarıdan
        # kontrol etmeye çalışmak her zaman başarısız olur. Dışarıdan erişim
        # yalnızca Caddy üzerinden, 443 portundan mümkün.
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s <<'REMOTE'
            set -euo pipefail

            cd /opt/finans/${{ steps.env.outputs.dir }}

            echo "--> Kod cekiliyor"
            git fetch --all
            git reset --hard origin/${{ github.event.workflow_run.head_branch }}

            COMPOSE="docker compose -f docker-compose.yml"
            if [ "${{ steps.env.outputs.dir }}" = "prod" ]; then
              COMPOSE="$COMPOSE -f docker-compose.prod.yml"
            fi
            COMPOSE="$COMPOSE -p ${{ steps.env.outputs.project }}"

            echo "--> Konteynerler guncelleniyor"
            # --force-recreate SART: `--build` imaji yeniden derliyor ama
            # compose bunu ayni ":latest" etiketine yazdigi icin bazen
            # calisan container'i degismemis sayip YENIDEN BASLATMIYOR.
            # Bir kez tam boyle oldu: api/mcp_server imaj build edildikten
            # SONRA bile 16 saat boyunca eski kodla calismaya devam etti,
            # RAG duzeltmeleri sessizce hic devreye girmedi (production'da
            # ölçümle doğrulandı). --force-recreate bu riski ortadan kaldirir.
            #
            # -V (--renew-anon-volumes) SART: frontend servisi node_modules'i
            # anonim bir volume'de tutuyor (docker-compose.yml). Bu volume
            # container yeniden olusturulsa bile OTOMATIK YENILENMIYOR - yeni
            # bir npm bagimliligi eklense (ornegin react-markdown) bile
            # calisan container eski, o bagimliligi icermeyen volume'u
            # kullanmaya devam ediyor ve "Failed to resolve import" hatasi
            # veriyor (production'da olculdu). -V, yalnizca ANONIM volume'leri
            # (bu projede tek ornegi frontend/node_modules) sifirlayip
            # image'in kendi icerigiyle yeniden doldurur; postgres/chroma gibi
            # ISIMLI volume'lere dokunmaz, veritabanini SILMEZ.
            $COMPOSE up -d --build --force-recreate -V

            echo "--> Sema gocu"
            $COMPOSE exec -T api alembic upgrade head

            echo "--> RAG dokumanlari indeksleniyor"
            # data/documents/ altina yeni bir .md eklendiginde Chroma'nin da
            # guncellenmesi gerekiyor; aksi halde deploy gecer ama Piyasa Ajani
            # yeni dokumani goremez.
            #
            # Idempotent: ayni icerikli parcalar atlanir, tekrar calistirmak
            # zararsiz.
            #
            # `|| true` / `|| echo` YOK ve eklenmemeli. Bir kez `|| echo ...` ile
            # yazilmisti; ingest sessizce cokerken deploy yesil kaldi ve RAG'in
            # neden bos oldugunu bulmak saatler aldi. Dokuman yoksa ingest artik
            # 0 donuyor (bkz. rag/ingest.py), dolayisiyla buraya dusen her hata
            # GERCEK bir hatadir ve deploy'u kirmalidir.
            $COMPOSE exec -T -w / api python -m rag.ingest

            echo "--> Uygulama sunuculari yeniden baslatiliyor"
            # Iki ayri sebep, tek adim:
            #
            # 1) SIRA. Yukarida `up -d` mcp_server'i baslatiyor ve
            #    market_tools.warm_up() koleksiyon nesnesini bellege aliyor.
            #    Hemen ardindan calisan ingest ise koleksiyonu SILIP yeniden
            #    yaratiyor (rag/vector_store.py `clear()`), yani yeni bir
            #    koleksiyon kimligi olusuyor. Yeniden baslatma olmazsa MCP
            #    sunucusu artik var olmayan bir koleksiyona bakar; deploy yesil
            #    gecer ama Piyasa Ajani her soruya NOT_FOUND doner. Prod'da
            #    tam olarak bu yasandi (2026-08-19).
            #
            # 2) BIND MOUNT. agents/, mcp_server/, rag/ imaja kopyalanmiyor,
            #    volume olarak baglaniyor (bkz. docker-compose.yml). Bu
            #    dizinlerde degisen kod imaji degistirmedigi icin
            #    `up -d --build` konteyneri yeniden YARATMAZ; yeni kod diske
            #    duser ama calisan surec eskisini bellekte tutar. api
            #    `--reload` ile calissa bile uvicorn yalnizca /app'i izliyor,
            #    /agents disarida kaliyor.
            $COMPOSE restart api mcp_server

            echo "--> Saglik kontrolu"
            for i in $(seq 1 18); do
              KOD=$(curl -s -o /dev/null -w "%{http_code}" \
                    http://localhost:${{ steps.env.outputs.port }}/health || true)
              if [ "$KOD" = "200" ]; then
                echo "Saglikli. ($i. denemede)"
                exit 0
              fi
              echo "Bekleniyor... ($i/18, son kod: $KOD)"
              sleep 5
            done

            echo "Uygulama 90 saniye icinde ayaga kalkmadi."
            $COMPOSE logs --tail 50 api
            exit 1
          REMOTE
