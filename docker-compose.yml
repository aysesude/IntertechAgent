services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT_HOST:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /:/app
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./mcp_server:/mcp_server
      - ./rag:/rag
      - ./data:/data
      - ./tests:/tests
      - ./scripts:/scripts
      - ./pytest.ini:/pytest.ini
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mcp_server:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /:/app
    ports:
      - "${MCP_PORT_HOST:-8100}:8100"
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./mcp_server:/mcp_server
      - ./rag:/rag
      - ./data:/data
    working_dir: /
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m mcp_server.server

  # Veritabanı tarayıcısı. Tabloları tıklayarak gezmek, satırları görmek ve
  # sorgu çalıştırmak için — SQL ezberlemeye gerek kalmaz.
  #
  # VARSAYILAN OLARAK ÇALIŞMAZ (profiles: tools). Bir veritabanı yönetim
  # panelini sürekli açık tutmak güvenlik riski; yalnızca ihtiyaç anında:
  #     docker compose --profile tools up -d adminer
  #     docker compose --profile tools stop adminer
  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT_HOST:-8090}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT_HOST:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

  # VİRA arayüzü (frontend-v2). `frontend` ile YAN YANA koşar, onun yerine
  # geçmez: mevcut arayüz çalışır durumda kalsın diye ayrı klasör, ayrı port.
  # Parite sağlandığında `frontend` emekliye ayrılıp isimler takas edilecek.
  frontend-v2:
    build:
      context: ./frontend-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # frontend-v2 KENDİ alan adından servis ediliyor ve o alan adında
      # Caddy /api/* yolunu backend'e vekilliyor — yani istekler AYNI KÖKENE
      # gider. Eski `frontend` başka bir alan adında durduğu için ayrı
      # değişken gerekiyor; ikisi aynı değeri paylaşamaz.
      #
      # Bu ayrım şart, sadece derli toplu olsun diye değil: test alan adı
      # basic_auth ile korunuyor ve tarayıcı ÇAPRAZ KÖKEN isteklerine
      # basic_auth bilgisini eklemez — arayüz API'yi komşu alan adından
      # çağırsaydı her istek 401 alırdı.
      #
      # Tanımlı değilse ortak değere düşer (tek arayüzün olduğu yerel kurulum).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL_V2:-${VITE_API_BASE_URL}}
    ports:
      # Sunucudaki host portu haritası (test ve prod aynı makinede koşuyor):
      #   5173 test eski arayüz · 5174 prod eski arayüz
      #   5175 test frontend-v2  · 5176 prod frontend-v2
      # Varsayılan 5175: 5174 prod'un eski arayüzünde DOLU (bir kez çakıştı,
      # deploy "port is already allocated" ile düştü).
      - "${FRONTEND_V2_PORT_HOST:-5175}:5174"
    volumes:
      - ./frontend-v2:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  chroma_data:
