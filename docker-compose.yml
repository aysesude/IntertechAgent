services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT_HOST:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /:/app
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./mcp_server:/mcp_server
      - ./rag:/rag
      - ./data:/data
      - ./tests:/tests
      - ./pytest.ini:/pytest.ini
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mcp_server:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /:/app
    ports:
      - "${MCP_PORT_HOST:-8100}:8100"
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./mcp_server:/mcp_server
      - ./rag:/rag
      - ./data:/data
    working_dir: /
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m mcp_server.server

  # Veritabanı tarayıcısı. Tabloları tıklayarak gezmek, satırları görmek ve
  # sorgu çalıştırmak için — SQL ezberlemeye gerek kalmaz.
  #
  # VARSAYILAN OLARAK ÇALIŞMAZ (profiles: tools). Bir veritabanı yönetim
  # panelini sürekli açık tutmak güvenlik riski; yalnızca ihtiyaç anında:
  #     docker compose --profile tools up -d adminer
  #     docker compose --profile tools stop adminer
  adminer:
    image: adminer:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT_HOST:-8090}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT_HOST:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  chroma_data:
